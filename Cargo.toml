[workspace]
resolver = "2"
members = ["ir200-core", "ir200", "ir200-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ragb/ir200-access-rs"
description = "BOSS IR-200 amp & IR cabinet pedal SysEx codec, CLI, and WASM bindings."

[workspace.dependencies]
ir200-core = { path = "ir200-core" }
# Shared foundation crates, pinned to the published kit (same tag the rest of the
# family uses). For local development against an unreleased kit, point these at
# `path = "../midi-access-kit/<crate>"`.
midi-access-core = { git = "https://github.com/ragb/midi-access-kit", tag = "v0.5.3" }
midi-access-cli = { git = "https://github.com/ragb/midi-access-kit", tag = "v0.5.3" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
schemars = "0.8"

[profile.release]
lto = "thin"
strip = true
